plugins {
    id 'java'
    id 'application'
}

group = 'com.jarvis'
version = '1.0.0'
sourceCompatibility = '11'

repositories {
    mavenCentral()
}

dependencies {
    // Google Cloud Text-to-Speech
    implementation 'com.google.cloud:google-cloud-texttospeech:2.12.0'
    
    // Google Cloud Speech-to-Text
    implementation 'com.google.cloud:google-cloud-speech:2.10.0'
    
    // JSON Processing
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.5'
    implementation 'org.slf4j:slf4j-simple:2.0.5'
}

application {
    mainClass = 'com.jarvis.JarvisAssistant'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.jarvis.JarvisAssistant'
    }
    
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.named('jar') {
    archiveBaseName = 'jarvis-ai-assistant'
    archiveVersion = '1.0.0'
}

// Task to run the application
tasks.register('runApp', JavaExec) {
    group = 'application'
    description = 'Run Jarvis AI Assistant'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.jarvis.JarvisAssistant'
}

// Task to build fat JAR
tasks.register('buildFatJar', Jar) {
    group = 'build'
    description = 'Build executable JAR with all dependencies'
    archiveBaseName = 'jarvis-ai-assistant-fat'
    archiveVersion = '1.0.0'
    
    manifest {
        attributes 'Main-Class': 'com.jarvis.JarvisAssistant'
    }
    
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
